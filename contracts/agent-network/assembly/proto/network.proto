syntax = "proto3";
package network;
message Config { bytes token = 1; bytes chain_id = 2; uint32 decimals = 3; uint64 job_cap = 4; bytes fee_to = 5; uint32 fee_bps = 6; }
message Agent { bytes id = 1; bytes owner = 2; bytes controller = 3; uint64 version = 4; bytes manifest = 5; uint64 sequence = 6; bool retired = 7; bytes nonce = 8; }
message Job {
 bytes id = 1; bytes buyer = 2; bytes provider = 3; bytes operator = 4; bytes fee_to = 5; bytes resolver = 6;
 uint64 amount = 7; uint32 fee_bps = 8; bytes terms_hash = 9; bytes service_hash = 10; bytes input_hash = 11;
 uint64 accept_by = 12; uint64 deliver_by = 13; uint64 review_window = 14; uint64 resolve_window = 15; uint64 long_stop = 16;
 uint32 state = 17; uint64 review_until = 18; uint64 resolve_until = 19; bytes output_hash = 20; uint64 awarded = 21;
 bytes grant_id = 22; uint64 grant_period = 23; bytes agent_id = 24; uint64 control_version = 25; bytes policy_hash = 26;
}
message Grant { bytes id = 1; bytes owner = 2; bytes controller = 3; bytes provider = 4; bytes resolver = 5; uint64 per_job = 6; uint64 period_cap = 7; uint64 lifetime_cap = 8; uint64 max_reserved = 9; uint32 max_open = 10; uint64 expires = 11; uint64 reserved = 12; uint64 paid = 13; uint32 open = 14; bool revoked = 15; bytes policy_hash = 16; uint64 nonce = 17; }
message Amount { uint64 value = 1; }
message Request { Config config = 1; Agent agent = 2; Job job = 3; Grant grant = 4; bytes id = 5; bytes account = 6; uint64 amount = 7; bytes commitment = 8; uint64 nonce = 9; uint32 rating = 10; }
message Result { bool ok = 1; Config config = 2; Agent agent = 3; Job job = 4; Grant grant = 5; uint64 amount = 6; uint64 liabilities = 7; uint64 token_balance = 8; bytes commitment = 9; Request request = 10; Review review = 11; }
message Review { bytes job_id = 1; bytes buyer = 2; uint32 rating = 3; bytes commitment = 4; uint64 revision = 5; }
