name: Core preview installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64 --arm64
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Prepare original voice and listening assets
        run: node scripts/prepare-live-senses.js
      - name: Build original Windows voice and computer helpers
        if: runner.os == 'Windows'
        run: |
          node scripts/build-windows-voice.js
          node scripts/build-windows-computer.js
      - run: npm test
      - run: npm run test:compat
      - name: Build preview only (no updater publication)
        run: npm run dist -- ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kai-core-preview-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
