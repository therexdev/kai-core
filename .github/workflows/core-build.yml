name: KAI Core Beta installers
on:
  push:
    branches: [main, foundation-v1]
    paths-ignore:
      - scripts/foundation/publish-core-release.js
      - core/test-core/windows-release-signing.test.js
      - .github/workflows/core-release-078-recovery.yml
      - .github/workflows/core-build.yml
      # App-smoke tooling has its own CI; test-only changes do not replace
      # already-published installers for the same application version.
      - scripts/foundation/apps-smoke.js
      - scripts/foundation/apps-publishers.json
      - scripts/foundation/inspector-observation.js
      - core/test-core/inspector-observation.test.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kai-core-installers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64 --arm64
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the existing Azure signing configuration
        if: runner.os == 'Windows'
        run: node scripts/foundation/configure-windows-signing.js --preflight
        env:
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run test:services
      - name: Checkout the reviewed Compare Models stream regression
        uses: actions/checkout@v4
        with:
          repository: therexdev/kai-plugin-model-compare
          ref: 9a447d3f39b7b205fabe19e995505815502e01bd
          path: .inference-plugins/compare
          persist-credentials: false
      - name: Checkout the reviewed Documents stream regression
        uses: actions/checkout@v4
        with:
          repository: therexdev/kai-plugin-documents
          ref: 419199f38237fc38a080c890cdf87cec29a81b10
          path: .inference-plugins/documents
          persist-credentials: false
      - name: Verify local inference ownership across Compare Models and Documents
        run: node .inference-plugins/compare/scripts/test-inference-integration.cjs
        env:
          KAI_CORE_SOURCE: ${{ github.workspace }}
          KAI_DOCUMENTS_SOURCE: ${{ github.workspace }}/.inference-plugins/documents
      - name: Configure Electron sandbox helper on Linux
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Native public SDK check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:foundation-native
      - name: Native public SDK check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:foundation-native
      - name: Alpha migration desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:alpha-migration -- --synthetic-keychain
      - name: Alpha migration desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:alpha-migration -- --synthetic-keychain
      - name: Wallet credit reconnection desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:credit-reconnect
      - name: Wallet credit reconnection desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:credit-reconnect
      - name: Styled dialog desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:dialogs
      - name: Styled dialog desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:dialogs
      - name: Application update desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:updates
      - name: Application update desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:updates
      - name: Wallet send dialog desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:wallet-send
      - name: Wallet send dialog desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:wallet-send
      - name: Verify real LFM3 and existing Qwen inference through Core
        timeout-minutes: 25
        run: node scripts/foundation/models-runtime-smoke.js
        env:
          KAI_MODEL_SMOKE_OUTPUT: ${{ github.workspace }}/.smoke/model-runtime
      - name: Preserve real model verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kai-model-runtime-${{ runner.os }}
          path: .smoke/model-runtime/
          if-no-files-found: warn
      - name: Prepare and verify the Windows signing module
        if: runner.os == 'Windows'
        run: ./scripts/foundation/prepare-windows-signing.ps1
      - name: Configure the established Windows publisher and mandatory signatures
        if: runner.os == 'Windows'
        run: node scripts/foundation/configure-windows-signing.js
        env:
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Build signed Windows Foundation installers
        if: runner.os == 'Windows'
        run: npm run dist -- ${{ matrix.args }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Build Foundation installers for macOS and Linux
        if: runner.os != 'Windows'
        run: npm run dist -- ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Windows signatures, publisher, timestamps and update feed
        if: runner.os == 'Windows'
        run: node scripts/foundation/verify-windows-signatures.js dist
      - uses: actions/upload-artifact@v4
        with:
          name: kai-core-foundation-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/*.exe.blockmap
            dist/latest.yml
            dist/windows-signatures-*.json
            build/foundation-files.json
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: kai-core-foundation-*
          path: release-assets
          merge-multiple: true
      - name: Publish signed Windows installers and verified update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/foundation/publish-core-release.js release-assets/dist
