name: Foundation checks
on:
  push:
    branches: [main, foundation-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build:manifest
      - run: npm test
      - run: npm run test:services
      - name: Checkout the reviewed additive network backend
        uses: actions/checkout@v4
        with:
          repository: therexdev/kai
          ref: 87a7bd87faac1e2bd707eb60f6d225cbf25cc8e8
          path: .network-integration
          persist-credentials: false
      - run: npm ci --ignore-scripts --prefix .network-integration
      - name: Verify catalog qualification, signed replies and provider recovery
        run: node --test --test-name-pattern="additive catalog|delegated worker recovers" core/test/wallet-first-integration.test.js
        env:
          KAI_WALLET_BACKEND: ${{ github.workspace }}/.network-integration
      - name: Configure Electron sandbox helper on Linux
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Native public plugin SDK (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:foundation-native
      - name: Native public plugin SDK (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:foundation-native
      - name: Application update desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:updates
      - name: Shared language and plugin propagation (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:language
      - name: Shared language and plugin propagation (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:language
      - name: Application update desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:updates
      - name: Legacy drop receipt desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:legacy-drop
      - name: Legacy drop receipt desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:legacy-drop
      - name: Model storage desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:model-storage
      - name: Model storage desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:model-storage
      - name: Native AppImage replacement and relaunch check
        if: runner.os == 'Linux'
        run: node scripts/foundation/linux-updates-smoke.js
