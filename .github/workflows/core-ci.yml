name: Foundation checks
on:
  push:
    branches: [main, foundation-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Verify recovery across real Windows protected profiles
        if: runner.os == 'Windows'
        run: node scripts/foundation/credit-source-storage-smoke.js
      - run: npm run build:manifest
      - run: npm test
      - run: npm run test:services
      - name: Checkout the reviewed Compare Models stream regression
        uses: actions/checkout@v4
        with:
          repository: therexdev/kai-plugin-model-compare
          ref: f2f1492d2972729b2eeb09a835da578e5837c90e
          path: .inference-plugins/compare
          persist-credentials: false
      - name: Checkout the reviewed Documents stream regression
        uses: actions/checkout@v4
        with:
          repository: therexdev/kai-plugin-documents
          ref: 419199f38237fc38a080c890cdf87cec29a81b10
          path: .inference-plugins/documents
          persist-credentials: false
      - name: Verify local inference ownership across Compare Models and Documents
        run: node .inference-plugins/compare/scripts/test-inference-integration.cjs
        env:
          KAI_CORE_SOURCE: ${{ github.workspace }}
          KAI_DOCUMENTS_SOURCE: ${{ github.workspace }}/.inference-plugins/documents
      - name: Checkout the reviewed native and managed network backend
        uses: actions/checkout@v4
        with:
          repository: therexdev/kai
          ref: 661c59ab9552bf38783034f168b78ae6912b1dec
          path: .network-integration
          persist-credentials: false
      - run: npm ci --ignore-scripts --prefix .network-integration
      - name: Verify model budgets, catalog qualification, signed replies and provider recovery
        run: node --test --test-name-pattern="explicit Alpha purchase recovery|additive catalog|delegated worker recovers|buffered network|all six managed defaults" core/test/wallet-first-integration.test.js core/test/managed-budget-integration.test.js
        env:
          KAI_WALLET_BACKEND: ${{ github.workspace }}/.network-integration
      - name: Configure Electron sandbox helper on Linux
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Native public plugin SDK (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:foundation-native
      - name: Native public plugin SDK (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:foundation-native
      - name: Credit access and trusted dialogs (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:dialogs
      - name: Credit access and trusted dialogs (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:dialogs
      - name: Application update desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:updates
      - name: Shared language and plugin propagation (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:language
      - name: Shared language and plugin propagation (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:language
      - name: Application update desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:updates
      - name: Legacy drop receipt desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:legacy-drop
      - name: Legacy drop receipt desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:legacy-drop
      - name: Sidebar wallet desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:sidebar-wallet
      - name: Sidebar wallet desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:sidebar-wallet
      - name: Model storage desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:model-storage
      - name: Model storage desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:model-storage
      - name: Local-only model library desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/foundation/local-models-smoke.js
      - name: Local-only model library desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: node scripts/foundation/local-models-smoke.js
      - name: Native AppImage replacement and relaunch check
        if: runner.os == 'Linux'
        run: node scripts/foundation/linux-updates-smoke.js
