name: Foundation checks
on:
  push:
    branches: [main, foundation-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build:manifest
      - run: npm test
      - run: npm run test:services
      - name: Configure Electron sandbox helper on Linux
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Native public plugin SDK (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:foundation-native
      - name: Native public plugin SDK (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:foundation-native
      - name: Application update desktop check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:updates
      - name: Application update desktop check (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:updates
